name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The oldest macOS DoubleTake supports, so the build proves it still compiles there.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Build the app (universal)
        run: scripts/build-app.sh --universal
